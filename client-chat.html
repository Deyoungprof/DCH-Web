<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080B14">
  <title>DCH Chat – Deyoungprof Creative Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* ── ROOT ── */
    :root {
      --brand:        #FF6B00;
      --brand-2:      #FF8C3A;
      --brand-glow:   rgba(255,107,0,0.22);
      --brand-glass:  rgba(255,107,0,0.10);
      --bg:           #080B14;
      --surface:      rgba(13,18,36,0.92);
      --surface-2:    rgba(18,22,40,0.82);
      --surface-3:    rgba(22,27,50,0.97);
      --border:       rgba(255,255,255,0.08);
      --border-active:rgba(255,107,0,0.45);
      --text:         #EDF0FF;
      --text-dim:     rgba(237,240,255,0.55);
      --text-muted:   rgba(237,240,255,0.30);
      --success:      #4ade80;
      --error:        #f87171;
      --radius:       22px;

      /* Safe area insets for notch / home bar */
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);

      /* Header height reference */
      --hdr-h: calc(56px + var(--sat));
      --input-h: 130px; /* approx input area incl quick replies */
    }

    html { height: 100%; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      /* prevent pull-to-refresh on iOS from jarring the layout */
      overscroll-behavior-y: none;
    }

    /* ── BG SCENE ── */
    #bg-scene {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; overflow: hidden;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); will-change: transform; }
    .orb-1 { width:500px;height:500px;background:radial-gradient(circle,#FF6B00,transparent 70%);top:-180px;left:-160px;opacity:.16;animation:drift 20s ease-in-out infinite alternate; }
    .orb-2 { width:380px;height:380px;background:radial-gradient(circle,#3B1FFF,transparent 70%);bottom:-120px;right:-120px;opacity:.18;animation:drift 24s ease-in-out infinite alternate;animation-delay:-7s; }
    .orb-3 { width:260px;height:260px;background:radial-gradient(circle,#FF6B00,transparent 70%);bottom:60px;left:35%;opacity:.09;animation:drift 17s ease-in-out infinite alternate;animation-delay:-3s; }
    .orb-4 { width:200px;height:200px;background:radial-gradient(circle,#0EA5E9,transparent 70%);top:40%;right:10%;opacity:.10;animation:drift 22s ease-in-out infinite alternate;animation-delay:-10s; }
    @keyframes drift { 0%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,15px) scale(1.04)}100%{transform:translate(-15px,30px) scale(0.96)} }

    #bg-scene::before {
      content:''; position:absolute; inset:0;
      background-image: linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
      background-size: 44px 44px;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp    { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes msgIn     { from{opacity:0;transform:translateY(10px) scale(.97)} to{opacity:1;transform:none} }
    @keyframes spin      { to{transform:rotate(360deg)} }
    @keyframes shimmer   { 0%{background-position:-600px 0} 100%{background-position:600px 0} }
    @keyframes dotBounce { 0%,60%,100%{transform:translateY(0);opacity:.3} 30%{transform:translateY(-5px);opacity:1} }
    @keyframes pulsering { 0%{transform:scale(.8);opacity:1} 100%{transform:scale(2.2);opacity:0} }
    @keyframes recPulse  { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    @keyframes recBarAnim{ from{height:4px} to{height:18px} }
    @keyframes fabPop    { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
    @keyframes tapFlash  { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }

    /* ── SPINNER / SHIMMER ── */
    .spinner { border:2px solid rgba(255,107,0,.15);border-top-color:var(--brand);border-radius:50%;animation:spin .65s linear infinite;flex-shrink:0; }
    .shimmer { background:linear-gradient(90deg,rgba(255,255,255,.04)25%,rgba(255,255,255,.09)50%,rgba(255,255,255,.04)75%);background-size:600px 100%;animation:shimmer 1.7s infinite linear; }

    /* ════════════════════════════════════
       MOBILE-FIRST LAYOUT
       Full-screen chat shell: header → messages → input
       ════════════════════════════════════ */

    /* ── HEADER ── */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      /* Respect top notch */
      padding-top: var(--sat);
      background: rgba(8,11,20,.92);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      transition: box-shadow .3s;
      animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both;
    }
    .site-header.scrolled { box-shadow: 0 4px 32px rgba(0,0,0,.55); }
    .site-header::after {
      content:''; position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(90deg,var(--brand-glow),transparent 60%);
      opacity: .2;
    }

    .hdr-inner {
      position: relative; z-index: 1;
      display: flex; align-items: center;
      justify-content: space-between; gap: 10px;
      padding: 10px 16px;
      /* Respect side notches */
      padding-left: calc(16px + var(--sal));
      padding-right: calc(16px + var(--sar));
      min-height: 56px;
    }

    /* Logo */
    .logo-wrap { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .logo-img-wrap {
      width:34px; height:34px; border-radius:9px;
      border:1px solid var(--border); background:var(--brand-glass);
      overflow:hidden; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
    }
    .logo-img-wrap img { width:100%;height:100%;object-fit:cover;display:block; }
    .logo-fallback {
      font-family:'Syne',sans-serif; font-size:13px; font-weight:800;
      background:linear-gradient(135deg,#FF7A1A,#FF5500);
      background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .logo-text-wrap { display:flex; flex-direction:column; }
    .logo-name { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; letter-spacing:-.01em; line-height:1.1; }
    .logo-sub  { font-size:10px; color:var(--text-muted); line-height:1.2; margin-top:1px; }

    /* Header right cluster */
    .hdr-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }

    /* User pill — compact on mobile */
    .user-pill {
      display:flex; align-items:center; gap:7px;
      background:rgba(255,255,255,.04); border:1px solid var(--border);
      border-radius:40px; padding:4px 10px 4px 4px;
      cursor:pointer; transition:background .2s, border-color .2s;
      /* Ensure minimum tap target */
      min-height: 40px;
      -webkit-user-select: none; user-select: none;
    }
    .user-pill:active { background:var(--brand-glass); border-color:var(--border-active); }

    .user-avatar-wrap {
      width:30px; height:30px; border-radius:50%;
      background:linear-gradient(135deg,rgba(255,107,0,.4),rgba(255,107,0,.1));
      border:1px solid rgba(255,107,0,.3);
      display:flex; align-items:center; justify-content:center;
      font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
      overflow:hidden; flex-shrink:0; color:var(--brand);
    }
    .user-avatar-wrap img { width:100%;height:100%;object-fit:cover;border-radius:50%; }

    .user-info { display:flex; flex-direction:column; min-width:0; }
    .user-name  { font-family:'Syne',sans-serif; font-size:12px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90px; }
    .user-email { font-size:9px; color:var(--text-muted); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90px; }

    /* Logout — icon only on mobile */
    .logout-btn {
      display:inline-flex; align-items:center; justify-content:center;
      border-radius:10px; border:1px solid var(--border);
      width:40px; height:40px;
      background:rgba(255,255,255,.04);
      cursor:pointer; color:var(--text-dim);
      transition:all .18s; flex-shrink:0;
    }
    .logout-btn:active { background:var(--brand-glass); color:var(--brand); border-color:var(--border-active); }
    .logout-btn svg { width:15px; height:15px; }
    .logout-btn .logout-label { display:none; } /* hidden on mobile */

    /* ── FULL-SCREEN CHAT SHELL ── */
    .chat-shell {
      position: fixed;
      /* sit below fixed header, respect bottom home bar */
      top: var(--hdr-h);
      left: 0; right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    /* ── CHAT SUB-HEADER ── */
    .chat-subhdr {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      padding-left: calc(16px + var(--sal));
      padding-right: calc(16px + var(--sar));
      background: rgba(8,11,20,.7);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; align-items:center; justify-content:space-between;
    }
    .agent-info  { display:flex; align-items:center; gap:10px; }
    .pulse-wrap  { position:relative; flex-shrink:0; }
    .pulse-av    {
      width:38px; height:38px; border-radius:50%;
      background:var(--brand-glass);
      border:1px solid rgba(255,107,0,.22);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .pulse-av img { width:100%;height:100%;object-fit:cover; }
    .pulse-av-fallback { font-family:'Syne',sans-serif; font-size:13px; font-weight:800; color:var(--brand); }
    .pulse-dot {
      position:absolute; bottom:1px; right:1px;
      width:10px; height:10px; background:var(--success);
      border-radius:50%; border:2px solid var(--bg);
    }
    .pulse-dot::after {
      content:''; position:absolute; inset:-3px; border-radius:50%;
      background:rgba(74,222,128,.3);
      animation:pulsering 2.2s ease-out infinite;
    }
    .agent-name   { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; }
    .agent-status { display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--text-dim); margin-top:1px; }
    .status-dot   { width:5px; height:5px; border-radius:50%; background:var(--success); flex-shrink:0; }

    /* ── AGENT BANNER ── */
    .agent-banner {
      display:none; align-items:center; justify-content:center; gap:6px;
      background:linear-gradient(90deg,rgba(74,222,128,.07),rgba(74,222,128,.03));
      border-bottom:1px solid rgba(74,222,128,.13);
      color:#86efac; font-size:11px; padding:7px 16px;
      animation:slideDown .3s ease both;
      flex-shrink: 0;
    }
    .agent-banner.show { display:flex; }

    /* ── MESSAGES SCROLL ── */
    .msg-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      scroll-behavior: smooth;
      padding: 16px 14px 8px;
      padding-left: calc(14px + var(--sal));
      padding-right: calc(14px + var(--sar));
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    /* Hide scrollbar but keep scrollable */
    .msg-scroll::-webkit-scrollbar { display: none; }
    .msg-scroll { scrollbar-width: none; }

    /* ── DATE DIVIDER ── */
    .date-div {
      display:flex; align-items:center; gap:8px;
      font-family:'Syne',sans-serif; font-size:10px; font-weight:600;
      color:var(--text-muted); margin:14px 0 6px; letter-spacing:.04em;
    }
    .date-div::before,.date-div::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── MESSAGE ROWS ── */
    .msg-row {
      display:flex; align-items:flex-end; gap:7px;
      margin-top:2px;
      animation:msgIn .22s cubic-bezier(.34,1.18,.64,1) both;
      position: relative;
      /* Extra bottom space for reply button below bubble */
      padding-bottom: 4px;
    }
    .msg-row.new-group { margin-top:12px; }
    .msg-row.is-client { flex-direction:row-reverse; }

    .msg-avatar {
      flex-shrink:0; width:28px; height:28px; border-radius:50%;
      font-family:'Syne',sans-serif; font-size:10px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; user-select:none;
      /* Avoid tiny avatar on small screens */
      min-width: 28px;
    }
    .msg-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }

    .bubble-col { display:flex; flex-direction:column; gap:2px; max-width:min(78%,380px); }
    .is-client .bubble-col { align-items:flex-end; }

    /* Name + badge */
    .bubble-name-row { display:flex; align-items:center; gap:5px; padding:0 3px; margin-bottom:1px; flex-wrap:wrap; }
    .bubble-sender   { font-size:10px; color:var(--text-muted); font-weight:500; }

    .badge {
      display:inline-flex; align-items:center; gap:2px;
      font-family:'Syne',sans-serif; font-size:8.5px; font-weight:700;
      padding:2px 6px; border-radius:20px; letter-spacing:.04em;
    }
    .badge-gemini { background:rgba(66,133,244,.13); color:#85b8ff; border:1px solid rgba(66,133,244,.22); }
    .badge-claude { background:rgba(204,120,92,.14); color:#e8aa7e; border:1px solid rgba(204,120,92,.22); }
    .badge-rule   { background:rgba(255,107,0,.12); color:#ff8c3a; border:1px solid rgba(255,107,0,.2); }
    .badge-human  { background:rgba(74,222,128,.11); color:#86efac; border:1px solid rgba(74,222,128,.2); }

    /* ── BUBBLES ── */
    .bubble {
      display:block; max-width:100%; width:fit-content;
      /* Larger padding for thumb-friendly reading */
      padding:10px 13px;
      word-break:break-word; line-height:1.6;
      font-size:14px; position:relative;
      /* Prevent text selection on tap-hold (use long-press for actions) */
      -webkit-user-select: none; user-select: none;
    }
    /* Re-enable text selection inside paragraph */
    .bubble p { margin:0; white-space:pre-wrap; -webkit-user-select:text; user-select:text; }

    .bubble-client {
      background:linear-gradient(140deg,#FF7C1F 0%,#FF5200 100%);
      color:#fff;
      border-radius:18px 18px 4px 18px;
      box-shadow:0 3px 16px rgba(255,107,0,.28),inset 0 1px 0 rgba(255,255,255,.12);
    }
    .bubble-client.pend { opacity:.65; }

    .bubble-ai {
      background:var(--surface-2);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border:1px solid var(--border); color:var(--text);
      border-radius:4px 18px 18px 18px;
      box-shadow:0 3px 12px rgba(0,0,0,.2);
    }

    .bubble-human {
      background:rgba(74,222,128,.07);
      border:1px solid rgba(74,222,128,.16);
      color:var(--text);
      border-radius:4px 18px 18px 18px;
    }

    /* ── BUBBLE REPLY BUTTON — appears just outside the bubble ── */
    .bubble-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      align-self: flex-end;
      margin-bottom: 18px; /* align with bottom of bubble roughly */
      flex-shrink: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s;
    }
    .bubble-actions.visible {
      opacity: 1;
      pointer-events: all;
    }
    /* Desktop: show on bubble hover — use row hover instead */
    @media (hover: hover) {
      .msg-row:hover .bubble-actions { opacity:1; pointer-events:all; }
    }
    .action-btn {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-3);
      border: 1px solid var(--border);
      cursor: pointer; color: var(--text-dim);
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      transition: background .15s, color .15s;
    }
    .action-btn:hover { background: var(--brand-glass); color: var(--brand); }
    .action-btn svg { width: 13px; height: 13px; }

    /* ── SWIPE-TO-REPLY indicator ── */
    .bubble-col {
      transition: transform .18s cubic-bezier(.34,1.2,.64,1);
      overflow: visible;
    }
    /* Clip swipe overflow without hiding the reply button using a wide clip on x axis */
    .msg-row.swiping { overflow: hidden; }
    .swipe-reply-hint {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      box-shadow: 0 2px 12px rgba(255,107,0,.5);
      transition: opacity .15s;
    }
    .swipe-reply-hint svg { width: 14px; height: 14px; stroke: #fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    /* Position: for client msgs (right side), hint appears on left; for others, on right */
    .is-client .swipe-reply-hint { left: 0; }
    .msg-row:not(.is-client) .swipe-reply-hint { right: 0; }
    .swipe-reply-hint.show { opacity: 1; }

    /* ── LONG-PRESS ACTION SHEET (mobile-friendly, replaces hover) ── */
    .bubble-ctx-menu {
      display:none;
      position:fixed;
      bottom:0; left:0; right:0;
      z-index:200;
      background:var(--surface-3);
      border-top:1px solid var(--border);
      border-radius:20px 20px 0 0;
      padding-bottom: calc(16px + var(--sab));
      box-shadow:0 -8px 40px rgba(0,0,0,.6);
      animation:slideUp .22s cubic-bezier(.34,1.1,.64,1);
    }
    .bubble-ctx-menu.open { display:block; }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

    .ctx-handle {
      width:36px; height:4px; background:rgba(255,255,255,.18);
      border-radius:2px; margin:12px auto 16px;
    }
    .ctx-preview {
      padding:0 18px 12px;
      font-size:12.5px; color:var(--text-dim);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      border-bottom:1px solid var(--border); margin-bottom:4px;
    }
    .ctx-actions { padding:4px 10px; }
    .ctx-btn {
      display:flex; align-items:center; gap:14px;
      width:100%; background:none; border:none; cursor:pointer;
      color:var(--text); font-size:15px; font-family:'DM Sans',sans-serif;
      padding:13px 8px; border-radius:12px;
      transition:background .15s;
      /* Big tap target */
      min-height:52px;
    }
    .ctx-btn:active { background:var(--brand-glass); }
    .ctx-btn svg { width:18px; height:18px; flex-shrink:0; }
    .ctx-btn.danger { color:var(--error); }

    /* Backdrop for context menu */
    .ctx-backdrop {
      display:none; position:fixed; inset:0; z-index:199;
      background:rgba(0,0,0,.5); backdrop-filter:blur(4px);
    }
    .ctx-backdrop.open { display:block; }

    /* ── Reply strip inside bubble ── */
    .reply-strip {
      display:flex; align-items:stretch;
      margin-bottom:7px; border-radius:8px; overflow:hidden;
      background:rgba(0,0,0,.15); border-left:3px solid rgba(255,255,255,.3);
    }
    .bubble-client .reply-strip { border-left-color:rgba(255,255,255,.55); background:rgba(0,0,0,.18); }
    .bubble-ai     .reply-strip,
    .bubble-human  .reply-strip { border-left-color:var(--brand); background:rgba(255,107,0,.06); }
    .reply-strip-inner  { padding:4px 8px; flex:1; min-width:0; }
    .reply-strip-sender { font-family:'Syne',sans-serif; font-size:9.5px; font-weight:700; color:var(--brand); margin-bottom:2px; }
    .bubble-client .reply-strip-sender { color:rgba(255,255,255,.85); }
    .reply-strip-text   { font-size:10.5px; opacity:.55; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px; }

    /* ── Bubble meta ── */
    .bubble-meta {
      display:flex; align-items:center; gap:3px;
      margin-top:3px; padding:0 2px;
      font-size:9.5px; color:var(--text-muted);
    }
    .is-client .bubble-meta { justify-content:flex-end; }

    /* ── Voice bubble ── */
    .voice-bubble { display:flex; align-items:center; gap:9px; min-width:170px; }
    .voice-play-btn {
      width:36px; height:36px; border-radius:50%;
      background:rgba(255,255,255,.15); border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:background .18s;
      /* Good tap target */
      min-width:36px;
    }
    .voice-play-btn:active { transform:scale(.93); }
    .bubble-client .voice-play-btn { background:rgba(255,255,255,.22); }
    .bubble-human  .voice-play-btn { background:rgba(74,222,128,.18); }
    .voice-waveform { flex:1; display:flex; align-items:center; gap:2px; height:26px; cursor:pointer; }
    .voice-bar { width:3px; border-radius:2px; background:rgba(255,255,255,.28); transition:background .15s; }
    .bubble-client .voice-bar { background:rgba(255,255,255,.45); }
    .bubble-ai     .voice-bar { background:rgba(255,107,0,.4); }
    .bubble-human  .voice-bar { background:rgba(74,222,128,.45); }
    .voice-bar.played                            { background:rgba(255,255,255,.85); }
    .bubble-client .voice-bar.played             { background:#fff; }
    .bubble-ai     .voice-bar.played             { background:var(--brand); }
    .bubble-human  .voice-bar.played             { background:var(--success); }
    .voice-dur { font-size:10.5px; opacity:.5; flex-shrink:0; }

    /* ── File card ── */
    .fcard {
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:12px;
      min-width:170px; max-width:240px;
      text-decoration:none; color:inherit; transition:opacity .18s;
    }
    .bubble-ai   .fcard,
    .bubble-human .fcard { background:rgba(255,255,255,.05); border:1px solid var(--border); }
    .bubble-client .fcard { background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.1); color:#fff; }
    .fcard:active { opacity:.85; }
    .fic { width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .bubble-ai   .fic,.bubble-human .fic { background:var(--brand-glass); }
    .bubble-client .fic { background:rgba(255,255,255,.15); }
    .fic svg { width:16px; height:16px; }
    .fcb { flex:1; min-width:0; }
    .fcn { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fcm { font-size:10px; opacity:.6; margin-top:1px; }
    .fcdl { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.08); flex-shrink:0; }
    .fcdl svg { width:12px; height:12px; }

    /* ── Typing indicator ── */
    .typing-wrap {
      flex-shrink:0;
      padding:4px 14px 10px;
      padding-left: calc(14px + var(--sal));
    }
    .typing-bub {
      display:inline-flex; align-items:center; gap:5px;
      padding:10px 14px;
      background:var(--surface-2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border:1px solid var(--border); border-radius:4px 18px 18px 18px;
    }
    .typing-dot { width:6px; height:6px; background:var(--text-muted); border-radius:50%; animation:dotBounce 1.4s ease-in-out infinite; }
    .typing-dot:nth-child(2){animation-delay:.18s} .typing-dot:nth-child(3){animation-delay:.36s}

    /* ── Skeleton ── */
    .sk-row { display:flex; align-items:flex-end; gap:8px; margin-bottom:14px; }
    .sk-row.right { flex-direction:row-reverse; }
    .sk-av  { width:28px; height:28px; border-radius:50%; flex-shrink:0; }
    .sk-bub { height:38px; border-radius:14px; }

    /* ── Scroll FAB ── */
    #scrollFab {
      /* Positioned relative to chat-shell bottom */
      position: absolute;
      bottom: calc(var(--input-h) + 12px);
      right: calc(14px + var(--sar));
      width:40px; height:40px; border-radius:50%;
      background:rgba(255,107,0,.88);
      display:none; align-items:center; justify-content:center;
      cursor:pointer; z-index:10; border:none;
      box-shadow:0 4px 18px rgba(255,107,0,.4);
      animation:fabPop .22s cubic-bezier(.34,1.3,.64,1) both;
      /* Good tap target */
      touch-action: manipulation;
    }
    #scrollFab.visible { display:flex; }
    #scrollFab svg { width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2.5; stroke-linecap:round; }

    /* ════════════════════════════════════
       INPUT AREA — sticky at bottom
       ════════════════════════════════════ */
    .input-area {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      padding-left: calc(12px + var(--sal));
      padding-right: calc(12px + var(--sar));
      /* Key: pad for iOS home bar */
      padding-bottom: calc(10px + var(--sab));
      background: rgba(8,11,20,.88);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }

    /* Quick replies */
    .qrs {
      display:flex; gap:6px;
      overflow-x: auto; overflow-y: hidden;
      padding-bottom: 8px;
      /* Smooth momentum scroll on iOS */
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .qrs::-webkit-scrollbar { display:none; }
    .qrc {
      flex-shrink:0;
      padding:7px 13px;
      border-radius:100px;
      background:rgba(255,255,255,.05);
      border:1px solid var(--border);
      color:var(--text-dim);
      font-size:12.5px; font-weight:500;
      font-family:'DM Sans',sans-serif;
      cursor:pointer; transition:all .15s;
      white-space:nowrap;
      scroll-snap-align: start;
      /* Taller for thumb friendliness */
      min-height: 34px;
      display:flex; align-items:center;
    }
    .qrc:active { background:var(--brand-glass); border-color:rgba(255,107,0,.3); color:var(--brand-2); transform:scale(.96); }

    /* Reply bar */
    .reply-bar {
      display:none; align-items:center; gap:8px;
      padding:7px 12px; margin-bottom:6px;
      background:rgba(255,107,0,.06); border:1px solid rgba(255,107,0,.15);
      border-radius:10px; animation:slideDown .18s ease;
    }
    .reply-bar.active { display:flex; }
    .reply-bar-line    { width:3px; height:32px; background:var(--brand); border-radius:3px; flex-shrink:0; }
    .reply-bar-content { flex:1; min-width:0; }
    .reply-bar-name    { font-family:'Syne',sans-serif; font-size:10.5px; font-weight:700; color:var(--brand-2); }
    .reply-bar-text    { font-size:11.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .reply-close-btn {
      width:32px; height:32px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:none; border:none; cursor:pointer;
      color:var(--text-muted); flex-shrink:0;
    }

    /* Voice record bar */
    .voice-record-bar {
      display:none; align-items:center; gap:9px;
      padding:9px 12px; margin-bottom:6px;
      background:rgba(239,68,68,.07); border:1px solid rgba(239,68,68,.2);
      border-radius:10px;
    }
    .voice-record-bar.active { display:flex; }
    .rec-pulse  { width:9px; height:9px; border-radius:50%; background:#ef4444; flex-shrink:0; animation:recPulse 1s ease-in-out infinite; }
    .rec-timer  { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; color:#f87171; font-variant-numeric:tabular-nums; }
    .rec-waveform { flex:1; display:flex; align-items:center; gap:2px; height:22px; overflow:hidden; }
    .rec-bar    { width:3px; border-radius:2px; background:rgba(239,68,68,.5); animation:recBarAnim .6s ease-in-out infinite alternate; }
    .rec-cancel-btn {
      background:none; border:none; cursor:pointer;
      color:rgba(239,68,68,.7); font-size:12px;
      font-family:'DM Sans',sans-serif; flex-shrink:0;
      padding:6px 8px; border-radius:8px; min-height:36px;
    }

    /* File bar */
    .file-bar {
      display:none; align-items:center; gap:7px; margin-bottom:6px;
      padding:7px 11px; background:var(--brand-glass);
      border:1px solid rgba(255,107,0,.15); border-radius:10px;
      animation:slideDown .2s ease;
    }
    .file-bar.show { display:flex; }

    /* Input row */
    .input-row { display:flex; gap:7px; align-items:flex-end; }

    #messageInput {
      flex:1;
      font-size:15px; /* iOS minimum to avoid auto-zoom on focus */
      font-family:'DM Sans',sans-serif;
      background:var(--surface-2);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid var(--border);
      border-radius:14px; color:var(--text);
      padding:10px 13px;
      outline:none;
      transition:border-color .2s, box-shadow .2s;
      resize:none; max-height:110px;
      line-height:1.5;
      scrollbar-width:none;
      /* Prevents iOS from styling the textarea oddly */
      appearance: none;
      -webkit-appearance: none;
    }
    #messageInput::placeholder { color:var(--text-muted); }
    #messageInput:focus { border-color:var(--border-active); box-shadow:0 0 0 3px rgba(255,107,0,.07); }
    #messageInput::-webkit-scrollbar { display:none; }

    .send-btn {
      background:linear-gradient(135deg,#FF7A1A,#FF5500);
      border-radius:13px; padding:10px 14px;
      font-family:'Syne',sans-serif; font-size:13px; font-weight:600;
      color:#fff; border:none; cursor:pointer;
      display:inline-flex; align-items:center; gap:5px;
      box-shadow:0 4px 16px rgba(255,107,0,.3);
      transition:transform .12s, box-shadow .15s;
      flex-shrink:0;
      /* Ensure tall enough tap target */
      min-height: 42px;
      touch-action: manipulation;
    }
    .send-btn:active:not(:disabled) { transform:scale(.93); box-shadow:0 2px 8px rgba(255,107,0,.2); }
    .send-btn:disabled { opacity:.55; pointer-events:none; }

    .icon-btn {
      width:42px; height:42px; flex-shrink:0;
      display:inline-flex; align-items:center; justify-content:center;
      border-radius:12px; border:1px solid var(--border);
      background:rgba(255,255,255,.05);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      color:var(--text-dim); cursor:pointer;
      transition:all .15s;
      touch-action: manipulation;
    }
    .icon-btn:active { background:var(--brand-glass); color:var(--brand); border-color:var(--border-active); transform:scale(.93); }
    .icon-btn svg { width:16px; height:16px; }
    #voiceBtn.recording { background:rgba(239,68,68,.14); color:#ef4444; border-color:rgba(239,68,68,.28); box-shadow:0 0 0 3px rgba(239,68,68,.09); }

    /* ── TOAST ── */
    #toast {
      position:fixed;
      bottom: calc(var(--input-h) + 16px);
      left:50%;
      transform:translateX(-50%) translateY(8px);
      background:var(--surface-3); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--border);
      border-radius:100px; padding:10px 18px;
      font-size:13px; color:var(--text);
      z-index:300; opacity:0; pointer-events:none;
      transition:opacity .2s, transform .2s;
      white-space:nowrap;
      box-shadow:0 8px 32px rgba(0,0,0,.4);
      max-width:calc(100vw - 32px);
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── PROFILE MODAL ── */
    .modal-back {
      position:fixed; inset:0; z-index:150;
      background:rgba(0,0,0,.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      display:flex; align-items:flex-end; /* slides up from bottom on mobile */
      padding:0;
      opacity:0; pointer-events:none; transition:opacity .22s;
    }
    .modal-back.open { opacity:1; pointer-events:all; }
    .modal-box {
      width:100%;
      /* Constrain on large screens */
      max-height:90dvh;
      overflow-y:auto;
      background:var(--surface-3);
      backdrop-filter:blur(32px); -webkit-backdrop-filter:blur(32px);
      border:1px solid var(--border);
      border-radius:22px 22px 0 0;
      padding:24px 20px;
      padding-bottom:calc(24px + var(--sab));
      transform:translateY(100%);
      transition:transform .28s cubic-bezier(.34,1.1,.64,1);
      box-shadow:0 -16px 60px rgba(0,0,0,.6);
      position:relative; overflow-x:hidden;
    }
    .modal-box::before {
      content:''; width:36px; height:4px; background:rgba(255,255,255,.18);
      border-radius:2px; display:block; margin:0 auto 20px;
    }
    .modal-back.open .modal-box { transform:translateY(0); }

    .modal-input {
      width:100%; background:rgba(255,255,255,.05);
      border:1px solid var(--border); border-radius:11px;
      padding:10px 13px; font-size:15px; /* avoid zoom on iOS */
      font-family:'DM Sans',sans-serif;
      color:rgba(255,255,255,.75); outline:none;
      appearance: none;
      -webkit-appearance: none;
    }
    .modal-lbl { display:block; font-family:'Syne',sans-serif; font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px; }

    .av-wrap { position:relative; display:inline-block; cursor:pointer; }
    .av-overlay {
      position:absolute; inset:0; border-radius:50%;
      background:rgba(0,0,0,.55);
      display:flex; align-items:center; justify-content:center;
      opacity:0; transition:opacity .2s;
    }
    /* Always show on touch devices */
    @media (hover: none) { .av-overlay { opacity:1; } }

    /* ════════
       DESKTOP ENHANCEMENTS (larger than 640px)
       Progressive enhancement — mobile is the base
       ════════ */
    @media(min-width:640px){
      .chat-shell {
        position:relative;
        top:auto; left:auto; right:auto; bottom:auto;
        display:flex; flex-direction:column;
        /* Revert to card layout on desktop */
      }

      /* Restore page wrap for desktop */
      .page-wrap {
        position:relative; z-index:1;
        max-width:960px; margin:0 auto;
        padding:20px 16px;
        animation:fadeUp .55s .15s cubic-bezier(.22,1,.36,1) both;
      }

      .chat-card {
        position:relative;
        border:1px solid var(--border);
        border-radius:var(--radius);
        background:var(--surface);
        backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
        overflow:hidden;
        box-shadow:0 32px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,107,0,.02);
      }
      .chat-card::before {
        content:''; position:absolute; top:0; left:0; right:0; height:1px;
        background:linear-gradient(90deg,transparent,rgba(255,107,0,.35),transparent);
      }

      .site-header {
        position:sticky; top:0;
        padding-top:0;
      }
      .hdr-inner { padding:10px 18px; max-width:1100px; margin:0 auto; }

      .msg-scroll {
        height:calc(100vh - 252px);
        overflow-y:auto;
        flex:none;
        padding:20px 20px 10px;
      }
      .msg-scroll::-webkit-scrollbar { width:3px; display:block; }
      .msg-scroll::-webkit-scrollbar-thumb { background:rgba(255,107,0,.18); border-radius:4px; }

      .bubble-col { max-width:min(65%,500px); }

      /* Show text in logout btn */
      .logout-btn { width:auto; padding:7px 13px; gap:6px; }
      .logout-btn .logout-label { display:inline; font-size:12px; }

      /* Profile modal — center on desktop */
      .modal-back { align-items:center; padding:16px; }
      .modal-box {
        max-width:440px;
        border-radius:22px;
        transform:translateY(20px) scale(.97);
        padding:28px;
        padding-bottom:28px;
      }
      .modal-box::before { display:none; }
      .modal-back.open .modal-box { transform:none; }

      /* Input area desktop padding */
      .input-area { padding:12px 18px 14px; }
      #messageInput { font-size:14px; }

      #scrollFab {
        position:absolute;
        bottom:100px; right:16px;
      }

      .user-name  { max-width:130px; }
      .user-email { max-width:130px; }
    }

    /* Hide logo-sub on very narrow */
    @media(max-width:380px){
      .logo-sub,.user-email { display:none; }
      .user-name { max-width:80px; }
    }

    ::selection { background:rgba(255,107,0,.25); color:#fff; }
  </style>
</head>
<body>

<div id="bg-scene" aria-hidden="true">
  <div class="orb orb-1" id="orb1"></div>
  <div class="orb orb-2" id="orb2"></div>
  <div class="orb orb-3" id="orb3"></div>
  <div class="orb orb-4"></div>
</div>

<div id="toast" role="alert" aria-live="polite"></div>

<!-- Context menu (long-press actions) -->
<div class="ctx-backdrop" id="ctxBackdrop"></div>
<div class="bubble-ctx-menu" id="ctxMenu">
  <div class="ctx-handle"></div>
  <div class="ctx-preview" id="ctxPreview"></div>
  <div class="ctx-actions">
    <button class="ctx-btn" id="ctxReply">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
      Reply
    </button>
    <button class="ctx-btn" id="ctxCopy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy text
    </button>
  </div>
</div>

<!-- ════════ HEADER ════════ -->
<header class="site-header" id="siteHeader">
  <div class="hdr-inner">
    <div class="logo-wrap">
      <div class="logo-img-wrap" id="logoBox">
        <img src="./logo.png" alt="DCH Logo"
             onload="this.style.display='block'"
             onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'">
        <span class="logo-fallback" id="logoFallback" style="display:none">DC</span>
      </div>
      <div class="logo-text-wrap">
        <div class="logo-name">DCH Chat</div>
        <div class="logo-sub">Deyoungprof Creative Hub</div>
      </div>
    </div>

    <div class="hdr-right">
      <div class="user-pill" id="userPill" onclick="openProfile()">
        <div class="user-avatar-wrap" id="headerAvatar">U</div>
        <div class="user-info">
          <span class="user-name"  id="headerName">Loading…</span>
          <span class="user-email" id="headerEmail"></span>
        </div>
      </div>

      <button class="logout-btn" id="logoutBtn" aria-label="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="logout-label">Logout</span>
      </button>
    </div>
  </div>
</header>

<!-- ════════ MAIN ════════ -->
<!-- Mobile: fixed full-screen shell. Desktop: wrapped in page-wrap card via JS -->
<div class="chat-shell" id="chatShell">

  <!-- Sub-header -->
  <div class="chat-subhdr">
    <div class="agent-info">
      <div class="pulse-wrap">
        <div class="pulse-av" id="subhdrAvatar">
          <span class="pulse-av-fallback">DC</span>
        </div>
        <div class="pulse-dot"></div>
      </div>
      <div>
        <div class="agent-name">DCH Chat</div>
        <div class="agent-status" id="agentStatus">
          <div class="status-dot"></div>
          <span>AI Assistant</span>
          <span style="color:var(--border)">•</span>
          <span style="color:var(--success)">Online</span>
        </div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px"><span>🇳🇬</span><span>Lagos</span></div>
  </div>

  <!-- Agent banner -->
  <div class="agent-banner" id="agentBanner">
    💬 A human agent has joined this conversation
  </div>

  <!-- Messages -->
  <div class="msg-scroll" id="messagesContainer">
    <div id="skeletonLoader">
      <div class="sk-row"><div class="sk-av shimmer"></div><div class="sk-bub shimmer" style="width:190px;border-radius:4px 18px 18px 18px"></div></div>
      <div class="sk-row right"><div class="sk-av shimmer"></div><div class="sk-bub shimmer" style="width:130px;border-radius:18px 18px 4px 18px"></div></div>
      <div class="sk-row"><div class="sk-av shimmer"></div><div class="sk-bub shimmer" style="width:240px;border-radius:4px 18px 18px 18px"></div></div>
      <div class="sk-row right"><div class="sk-av shimmer"></div><div class="sk-bub shimmer" style="width:100px;border-radius:18px 18px 4px 18px"></div></div>
      <div class="sk-row"><div class="sk-av shimmer"></div><div class="sk-bub shimmer" style="width:180px;border-radius:4px 18px 18px 18px"></div></div>
    </div>
  </div>

  <!-- Typing indicator -->
  <div id="typingIndicator" style="display:none" class="typing-wrap">
    <div style="display:flex;align-items:flex-end;gap:7px">
      <div class="msg-avatar" style="background:var(--brand-glass);border:1px solid rgba(255,107,0,.18);font-size:15px">🤖</div>
      <div class="typing-bub"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
    </div>
  </div>

  <!-- Scroll FAB -->
  <button id="scrollFab" onclick="scrollBottom(true)" aria-label="Scroll to bottom">
    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <!-- Input area -->
  <div class="input-area">

    <!-- Quick replies -->
    <div class="qrs" id="quickReplies">
      <button class="qrc">👋 Hello!</button>
      <button class="qrc">💰 Pricing</button>
      <button class="qrc">🌐 Web design</button>
      <button class="qrc">🎨 Branding</button>
      <button class="qrc">📱 Social media</button>
      <button class="qrc">⏱ Timeline?</button>
      <button class="qrc">📞 Talk to agent</button>
      <button class="qrc">🙏 Thank you!</button>
    </div>

    <!-- Reply bar -->
    <div class="reply-bar" id="replyBar">
      <div class="reply-bar-line"></div>
      <div class="reply-bar-content">
        <div class="reply-bar-name" id="replyBarName"></div>
        <div class="reply-bar-text" id="replyBarText"></div>
      </div>
      <button class="reply-close-btn" onclick="cancelReply()" aria-label="Cancel reply">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

<script type="module">
  import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

           doc, getDoc, getDocs, serverTimestamp, updateDoc }
